name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  # Lets a release be re-verified without an empty commit.
  workflow_dispatch:

# Supersede a run when the same pull request branch is pushed again, but never
# cancel one on master or a manual re-verification — those exist to leave a verdict
# on a commit, and a cancelled one leaves none.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Nothing here writes to the repository; the token only lifts Composer's
# unauthenticated GitHub API rate limit when fetching dist archives.
permissions:
  contents: read

# Third-party actions are pinned by commit SHA rather than tag, because a tag can
# be moved onto different code after review. GitHub's own actions/* are pinned to
# the major, which GitHub controls and repoints deliberately.
env:
  # Installing Neos pulls well over a hundred packages as GitHub dist archives,
  # which exhausts the 60-per-hour unauthenticated API limit.
  COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.GITHUB_TOKEN }}"}}'

  # Everything neos/flow and neos/utility-unicode declare, plus what PHPUnit and
  # PHP_CodeSniffer need. ctype, filter, json, libxml, openssl, pcre, phar,
  # reflection and spl are in the default build and need no request.
  PHP_EXTENSIONS: mbstring, xml, xmlreader, xmlwriter, simplexml, dom, tokenizer, zlib

jobs:
  # Lint is deliberately not part of the test matrix below. There is no PHPStan
  # baseline in this package — every reported error is a real one to be fixed, not
  # recorded — and neither the coding standard nor level 5 analysis varies by
  # interpreter, so repeating them per matrix cell would only multiply the same
  # output. One authoritative run against the newest dependencies is enough.
  lint:
    name: Lint (PHP 8.3, highest deps)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Supplies both the interpreter and Composer. Earlier revisions ran the
      # official php:<version>-cli image in a container instead, which on a
      # GitHub-hosted runner buys nothing and costs the apt-get and
      # getcomposer.org bootstrap that image needs — the two private packages in
      # this fleet are on the container path only because their self-hosted
      # runner's own PHP is unusable.
      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          extensions: ${{ env.PHP_EXTENSIONS }}
          tools: composer:v2
          coverage: none

      # composer validate --strict runs as part of composer lint below, as
      # lint:composer.
      - name: Install dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
        with:
          dependency-versions: highest
          composer-options: "--prefer-dist"

      - name: Run Linting (composer validate, PHPStan & PHP CodeSniffer)
        run: composer lint

  test:
    name: Test (PHP ${{ matrix.php }}, ${{ matrix.deps }} deps)
    # GitHub-hosted, unlike Medienreaktor.FigmaTools and
    # Medienreaktor.XmediaImport, which run on the org's self-hosted runner. This
    # repository is public and those are private, and that one difference points
    # them in opposite directions: the org runner group is set to
    # allows_public_repositories: false, so a job from here is never claimed and
    # sits queued indefinitely next to an idle runner, while GitHub-hosted minutes
    # are free and unlimited for public repositories.
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      # Let every version report rather than killing the rest when the first fails.
      fail-fast: false
      matrix:
        # composer.json declares php >=8.3 with neos/* ^9.0, and both ends of that
        # are exercised rather than asserted:
        #
        #   - `lowest` pins the oldest set the constraints permit: Neos 9.0,
        #     PHPUnit 11.5, PHPStan 2.2.
        #   - `highest` walks up to the newest Neos 9 line.
        #
        # 8.5 pairs with `highest` only, and always will: `lowest` deliberately
        # pins dependencies that predate 8.5 and cannot be expected to run on it.
        include:
          - { php: '8.3', deps: 'lowest' }
          - { php: '8.3', deps: 'highest' }
          - { php: '8.4', deps: 'highest' }
          - { php: '8.5', deps: 'highest' }

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          tools: composer:v2
          coverage: none

      # Resolves from the constraints every time — no composer.lock is committed,
      # which is what makes the lowest/highest split meaningful. The action caches
      # the Composer download cache per PHP version and dependency preference.
      - name: Install dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
        with:
          dependency-versions: ${{ matrix.deps }}
          composer-options: "--prefer-dist"

      # Makes the floor claim auditable: the log states which Neos the job actually
      # ran against, rather than leaving it to be inferred from the matrix name.
      - name: Show resolved dependency versions
        run: composer show --direct

      - name: Run Tests (PHPUnit)
        run: composer test
